<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数流交互展示</title><style>html,body{margin:0;background:#090911;color:#c5c5e5;font:14px/1.6 sans-serif}canvas{width:100%;aspect-ratio:16/9;display:block;outline:none}#status{padding:12px 18px}nav{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 18px}button,select{background:#24243a;color:inherit;border:1px solid #ffffff30;padding:7px 12px;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#57597b}button:disabled{opacity:.4}</style></head><body><canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="原游戏交互画面"></canvas><div id="status" role="status">正在加载游戏…</div><nav><label id="variants" hidden>动作片段 <select id="variant" aria-label="选择动作片段"><option value="">片段 1</option><option value="-b">片段 2</option><option value="-c">片段 3</option></select></label><button id="replay" disabled>重新播放</button><button id="eye" disabled aria-pressed="false">RGB 眼睛</button><button id="full" disabled>全屏</button></nav><script src="player.js"></script></body></html>
